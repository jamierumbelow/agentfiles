"npm:@googleworkspace/cli" = "0.18.1"
"npm:@readwise/cli" = "latest"
op = "2.32.1"
"github:Dicklesworthstone/coding_agent_session_search" = "0.4.0"
"github:Dicklesworthstone/beads_rust" = "0.1.34"
"github:Dicklesworthstone/beads_viewer" = "0.15.2"
