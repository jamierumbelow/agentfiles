# Antigravity CLI (`agy`). No package-manager distribution — Google ships it via
# an install script that reads per-platform manifests. To bump the version, fetch
# https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/<platform>.json
# for each platform below and copy the new `url` + `sha512`. The URL embeds an
# opaque build id, so it can't be templated from {{version}}. The archive ships a
# binary named `antigravity`, hence rename_exe.
[tools."http:agy"]
version = "1.1.19"
rename_exe = "agy"

[tools."http:agy".platforms]
macos-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.19-4894004681244672/darwin-arm/cli_mac_arm64.tar.gz", checksum = "sha512:54b6b0e2e2fed5d5e270c6353f8097bd2a0e966f07946ded8065a6293b79ec7be5993f5d3de5c12d0683b33822a5cb887795094ffa2c6f77bb7183816c92ae96" }
macos-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.19-4894004681244672/darwin-x64/cli_mac_x64.tar.gz", checksum = "sha512:e6f9e0c3e0d32509937cb6aa5f6e00096aed2a78ab3e21ffdcf05ddbbf0e2b4772388196d9dbbc356400b16adc3ba6d2ecb8d8fdafa9489604ed3b3bbd775f95" }
linux-x64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.19-4894004681244672/linux-x64/cli_linux_x64.tar.gz", checksum = "sha512:7c3b310c80685adcba714994207eb870fb4817403975da46555b7d9fade446487da3d8f897aa220dfbc30f602ab461a0147a6f7b3c8228fdebd35951e3f250fd" }
linux-arm64 = { url = "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.19-4894004681244672/linux-arm/cli_linux_arm64.tar.gz", checksum = "sha512:488c3dac1c7ca866a9da990f9a88648bfb7176992a0a2d27605e3bc10143e5b17af552ed99f0bf4250e2d69fed6d0d5f50684c729bf03f269f2b52b44503558d" }

# rtk ships rtk, rtk-oss and rtk-proxy builds per platform, so pin the asset explicitly.
[tools."github:rtk-ai/rtk"]
version = "1.0.1"

[tools."github:rtk-ai/rtk".platforms]
macos-arm64 = { asset_pattern = "rtk-aarch64-apple-darwin.tar.gz" }
macos-x64 = { asset_pattern = "rtk-x86_64-apple-darwin.tar.gz" }
linux-x64 = { asset_pattern = "rtk-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "rtk-aarch64-unknown-linux-gnu.tar.gz" }
